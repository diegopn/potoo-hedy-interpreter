[package]
name = "potoo-hedy-interpreter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-hedy-interpreter"
homepage = "https://diegopn.github.io/potoo-site/manual/hedy/"
readme = "README.md"
description = "A host-driven Rust interpreter for the English Hedy language profile, levels 1–16."

[lib]
name = "potoo_hedy_interpreter"
path = "src/lib.rs"

[[bin]]
name = "potoo-hedy"
path = "src/bin/potoo-hedy.rs"
